{{- if or (not (hasKey .Values.config "controller.webhook.enabled")) (eq (toString (index .Values.config "controller.webhook.enabled")) "true") }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/odh-db-operator-serving-cert
  name: odh-db-operator-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: odh-db-operator-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-infrastructure-opendatahub-io-v1alpha1-databaseclaim
  failurePolicy: Fail
  name: vdcextensions.infrastructure.opendatahub.io
  rules:
  - apiGroups:
    - infrastructure.opendatahub.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - databaseclaims
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: odh-db-operator-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-infrastructure-opendatahub-io-v1alpha1-schemaclaim
  failurePolicy: Fail
  name: vscextensions.infrastructure.opendatahub.io
  rules:
  - apiGroups:
    - infrastructure.opendatahub.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - schemaclaims
  sideEffects: None
  timeoutSeconds: 10
{{- end }}
