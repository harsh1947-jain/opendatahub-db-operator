---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-infrastructure-opendatahub-io-v1alpha1-databaseclaim
  failurePolicy: Fail
  name: vdcextensions.infrastructure.opendatahub.io
  rules:
  - apiGroups:
    - infrastructure.opendatahub.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - databaseclaims
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-infrastructure-opendatahub-io-v1alpha1-schemaclaim
  failurePolicy: Fail
  name: vscextensions.infrastructure.opendatahub.io
  rules:
  - apiGroups:
    - infrastructure.opendatahub.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - schemaclaims
  sideEffects: None
  timeoutSeconds: 10
